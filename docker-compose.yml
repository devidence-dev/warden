services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warden}
      POSTGRES_DB: ${POSTGRES_DB:-warden}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warden}"]
      interval: 5s
      timeout: 5s
      retries: 5

  warden:
    container_name: warden
    build: .
    image: warden:latest
    ports:
      - "${PORT:-9000}:${PORT:-9000}"
    environment:
      PORT: ${PORT:-9000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-warden}:${POSTGRES_PASSWORD:-warden}@db:5432/${POSTGRES_DB:-warden}
      GROQ_API_KEY: ${GROQ_API_KEY:-your_groq_api_key_here}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-3}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head && uv run granian --interface asgi --host 0.0.0.0 --port ${PORT:-9000} src.main:app"
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
