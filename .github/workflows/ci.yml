name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Static security analysis (bandit)
        run: uvx bandit -r src -ll -ii

      - name: Export dependencies for vulnerability audit
        run: uv export --no-dev --format requirements-txt --no-hashes -o requirements-audit.txt

      - name: Dependency vulnerability scan (pip-audit)
        run: uvx pip-audit -r requirements-audit.txt --no-deps

      - name: Secret scanning (gitleaks)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source="/repo" --no-banner --redact --exit-code 1

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@v5.0.0

  open-pr:
    name: Open PR to main
    needs: [test, security]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Create pull request to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "${{ github.ref_name }}" --base main --state open --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for ${{ github.ref_name }} -> main, nothing to do."
            exit 0
          fi
          gh pr create --base main --head "${{ github.ref_name }}" --fill
