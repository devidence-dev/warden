name: Tag release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Create semver tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version bump from PR title
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          major_pattern='^[a-zA-Z]+(\([^)]*\))?!:'
          feat_pattern='^feat(\([^)]*\))?:'
          bump="patch"
          if [[ "$PR_TITLE" =~ $major_pattern ]] || [[ "$PR_TITLE" == *"BREAKING CHANGE"* ]]; then
            bump="major"
          elif [[ "$PR_TITLE" =~ $feat_pattern ]]; then
            bump="minor"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Compute next tag
        id: next_tag
        run: |
          set -euo pipefail
          last_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          version="${last_tag#v}"
          version="${version:-0.0.0}"
          IFS='.' read -r major minor patch <<< "$version"
          case "${{ steps.bump.outputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${last_tag}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.next_tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next_tag.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.next_tag.outputs.previous_tag }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS_TAG" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes --notes-start-tag "$PREVIOUS_TAG"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
